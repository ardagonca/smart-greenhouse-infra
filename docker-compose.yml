services:
  # 3. TimescaleDB (Yerel Veritabanı) - SUPABASE KULLANILDIĞI İÇİN KAPALI
  # timescaledb:
  #   image: timescale/timescaledb:latest-pg14
  #   ... (Devre dışı)

  # 4. FastAPI Backend (AI Modeli ve Veri Akışı)
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenhouse_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    ports:
      - "127.0.0.1:8000:8000"  # sadece bu bilgisayar; ağdaki başkaları erişemesin
    volumes:
      - ./backend:/app
    networks:
      - greenhouse_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. React Frontend Paneli - LOKALDE ÇALIŞTIRILIYOR (npm run dev)
  # frontend:
  #   ... (Devre dışı)

networks:
  greenhouse_network:
    driver: bridge

volumes:
  timescaledb_data:
