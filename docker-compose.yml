services:
  # 3. TimescaleDB (Yerel Veritabanı) - SUPABASE KULLANILDIĞI İÇİN KAPALI
  # timescaledb:
  #   image: timescale/timescaledb:latest-pg14
  #   ... (Devre dışı)

  # 4. FastAPI Backend (AI Modeli ve Veri Akışı)
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenhouse_api
    dns: [1.1.1.1, 8.8.8.8]  # Docker Desktop'ın iç DNS'i zaman zaman dış adresleri çözemiyor
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    ports:
      - "127.0.0.1:8000:8000"  # sadece bu bilgisayar; ağdaki başkaları erişemesin
    volumes:
      - ./backend:/app
    networks:
      - greenhouse_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. MQTT broker: yalnızca docker ağı içinde (host'a port açılmaz)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: greenhouse_mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - greenhouse_network
    restart: always

  # 3. Yayıncı: Verdify saatlik arşivi -> MQTT (gerçek sera sensörü yerine geçer)
  publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile.ingest
    container_name: greenhouse_publisher
    dns: [1.1.1.1, 8.8.8.8]  # Docker Desktop'ın iç DNS'i zaman zaman dış adresleri çözemiyor
    command: python -u -m ingest.publisher
    depends_on:
      - mosquitto
    networks:
      - greenhouse_network
    restart: always

  # 3b. Köprü: MQTT -> FastAPI /api/telemetry (kayıt ve canlı yayın API'de)
  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.ingest
    container_name: greenhouse_bridge
    command: python -u -m ingest.bridge
    volumes:
      - bridge_spool:/spool  # API/veritabanı yokken iletilemeyen ölçümler
    depends_on:
      - mosquitto
      - fastapi
    networks:
      - greenhouse_network
    restart: always

networks:
  greenhouse_network:
    driver: bridge

volumes:
  mosquitto_data:
  bridge_spool:
